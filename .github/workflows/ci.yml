name: ci
on: [push, pull_request]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .
  smoke:
    strategy:
      fail-fast: false
      matrix:
        nvim: [stable, nightly]
    runs-on: ubuntu-latest
    # first run clones plugins, compiles parsers and installs lua_ls via Mason (~1-2 min);
    # the cap keeps an accidental blocking prompt from burning the 6h default
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: tools
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep build-essential unzip
          npm install -g tree-sitter-cli
          nvim --version && tree-sitter --version
      - name: smoke test
        run: bash ./scripts/test.sh
